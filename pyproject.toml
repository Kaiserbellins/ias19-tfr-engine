[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ias19tfr"
version = "0.1.0"
description = "Motore di valutazione IAS 19 del TFR (Financial proration e linear proration)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openpyxl>=3.1", "requests>=2.28", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ias19tfr = "ias19tfr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
